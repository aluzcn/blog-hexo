# --------------------------------------
# Hexo Butterfly Theme 美化微调配置
# --------------------------------------
nav:
  logo: /img/logo.png
  display_title: false
  display_post_title: true
  fixed: false
  menu:
    首页: / || fas fa-home
    归档: /archives/ || fas fa-archive
    标签: /tags/ || fas fa-tags
    分类: /categories/ || fas fa-folder-open
    搜索: javascript:Butterfly.openSearch() || fas fa-search

code_blocks:
  theme: light
  macStyle: true
  height_limit: false
  word_wrap: false
  copy: true
  language: true
  shrink: false
  fullpage: false

social:
  # fab fa-github: https://github.com/你的用户名 || Github || '#24292e'
  # fas fa-envelope: mailto:你的邮箱 || Email || '#4a7dbe'

favicon: /img/favicon.png
avatar:
  img: /img/butterfly-icon.png
  effect: true

disable_top_img: false
default_top_img: /img/banner.jpg
index_img: /img/banner.jpg
archive_img:
tag_img:
tag_per_img:
category_img:
category_per_img:
footer_img: false
background:


cover:
  index_enable: false
  aside_enable: true
  archives_enable: true
  default_cover:
    # - /img/default-cover.jpg

error_img:
  flink: /img/friend_404.gif
  post_page: /img/404.jpg

error_404:
  enable: true
  subtitle: '页面走丢啦'
  background:

post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: true
    label: true
  post:
    position: left
    date_type: both
    date_format: date
    categories: true
    tags: true
    label: true

# 首页配置｜开启打字机副标题
index_site_info_top:
index_top_img_height: 220px
subtitle:
  enable: true
  effect: true
  typed_option:
  source: false
  sub:
    - 欢迎来到我的博客
    - 记录学习与生活
    - 道阻且长，行则将至

# 首页文章布局 4：封面在上，信息在下，阅读体验更适合中文
index_layout: 4

index_post_content:
  method: 3
  length: 300

toc:
  post: true
  page: false
  number: true
  expand: false
  style_simple: false
  scroll_percent: true

post_copyright:
  enable: true
  decode: false
  author_href:
  license: CC BY‑NC‑SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

reward:
  enable: false
  text:
  QR_code:

post_edit:
  enable: false
  url:

related_post:
  enable: true
  limit: 6
  date_type: created

post_pagination: 1

noticeOutdate:
  enable: false
  style: flat
  limit_day: 540
  position: top
  message_prev: 这篇文章距离最后更新已有
  message_next: 天，部分内容可能已经过时。

footer:
  nav:
  owner:
    enable: true
    since: 2026
  copyright:
    enable: true
    version: false
  custom_text: "<a href='https://beian.miit.gov.cn/' target='_blank'>填写你的备案号</a>"

aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: '热爱技术，乐于分享'
    button:
      enable: true
      icon: fab fa-github
      text: Github
      link: https://github.com/xxxx
  card_announcement:
    enable: true
    content: '🎉欢迎来访，有问题欢迎留言交流'
  card_recent_post:
    enable: true
    limit: 6
    sort: date
    sort_order: 4
  card_newest_comments:
    enable: false
    sort_order:
    limit: 6
    storage: 10
    avatar: true
  card_categories:
    enable: true
    limit: 10
    expand: none
    sort_order: 1
  card_tags:
    enable: true
    limit: 50
    color: true
    custom_colors:
    orderby: random
    order: 2
    sort_order: 3
  card_archives:
    enable: true
    type: monthly
    format: YYYY年MM月
    order: -1
    limit: 12
    sort_order: 4
  card_post_series:
    enable: true
    series_title: true
    orderBy: 'date'
    order: -1
    sort_order: 5
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    sort_order: 6
